<script>
  document.body.insertAdjacentHTML('afterbegin', skySVG());
  document.getElementById('toc').innerHTML = GUIDE.map(c => `<a href="#${c.id}">${c.n}</a>`).join('');
  document.getElementById('chapters').innerHTML = GUIDE.map(c => `<section id="${c.id}" class="pcard2"><h2>${c.n}</h2><div class="guide">${c.html()}</div></section>`).join('');
